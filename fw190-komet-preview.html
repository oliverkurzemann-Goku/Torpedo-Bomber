<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Original Fw 190 &amp; Komet</title>
<style>body{margin:0;background:#b7c3c7;font:14px system-ui;color:#f3f4ed}canvas{display:block;touch-action:none}aside{position:absolute;z-index:2;top:20px;left:20px;width:218px;background:#182a32ed;padding:20px;border-radius:10px}h1{font-size:22px;margin:0 0 8px}p,small{line-height:1.5}button,select{padding:8px;margin:3px 0;border:0;border-radius:4px;background:#e8e6d9;color:#18252b;cursor:pointer}label{display:block;margin:12px 0}input[type=range]{width:120px;float:right}small{color:#c1c9c7}nav{display:flex;gap:4px;flex-wrap:wrap}</style>
<aside><select id="aircraft"><option value="fw190">Fw 190 A-8</option><option value="me163">Me 163 B Komet</option></select><h1 id="title">Original aircraft</h1><small id="dimensions"></small><p>Original geometry and weathered paint.</p><nav><button onclick="view('hero')">3D</button><button onclick="view('side')">Side</button><button onclick="view('top')">Top</button><button onclick="view('front')">Front</button></nav><label>Gear / skid <input id="gear" type="range" min="0" max="1" step=".01" value="1"></label><label>Flaps <input id="flaps" type="range" min="0" max="1" step=".01" value="0"></label><label>Roll <input id="roll" type="range" min="-1" max="1" step=".01" value="0"></label><label>Pitch <input id="pitch" type="range" min="-1" max="1" step=".01" value="0"></label><label><input id="spin" type="checkbox"> Spin propeller / generator</label><small>Build 209 · Fictional markings<br>Drag the model to orbit.</small></aside>
<script src="vendor/three-r128.min.js"></script><script src="vendor/GLTFLoader-r128.js"></script><script src="aircraft-contract.js?v=209"></script><script src="me163-native.js?v=209"></script><script src="aircraft-articulation.js?v=209"></script><script src="terrain-system/AircraftGround.js?v=209"></script><script>
'use strict';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#b4c3c9');scene.add(new THREE.HemisphereLight(0xd9eeff,0x5e5949,.85));const sun=new THREE.DirectionalLight(0xffedda,1.5);sun.position.set(-8,15,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12});sun.shadow.bias=-.0002;scene.add(sun);const fill=new THREE.DirectionalLight(0xc2dcff,.5);fill.position.set(9,5,-6);scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x9b9e91,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.position.y=-1.90;ground.receiveShadow=true;scene.add(ground);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,200),ortho=new THREE.OrthographicCamera(-6*innerWidth/innerHeight,6*innerWidth/innerHeight,6,-6,.1,200);let cam=camera,model,kind='fw190',mode='hero';
function render(){renderer.render(scene,cam);}
function pose(){if(!model)return;AircraftArticulation.pose(model,+gear.value,{left:+flaps.value,right:+flaps.value});AircraftArticulation.controls(model,+roll.value,+pitch.value);model.rotation.set(0,0,0);model.position.set(0,0,0);ground.visible=mode==='hero'&&+gear.value>.99;if(ground.visible){const fit=AircraftGround.fit(model,kind,0,0,0,()=>ground.position.y);if(fit){model.quaternion.copy(fit.quaternion);model.position.y=fit.y;}}render();}
function view(v){mode=v;cam=v==='hero'?camera:ortho;cam.position.set(...({hero:[-11,5.8,14],side:[-22,0,0],top:[0,22,0],front:[0,0,22]}[v]));cam.up.set(0,1,0);if(v==='top')cam.up.set(0,0,-1);cam.lookAt(0,0,0);pose();}
async function load(k){window.ready=false;kind=k;if(model){scene.remove(model);model.traverse(o=>{if(o.isMesh)o.geometry.dispose();});}const g=await new THREE.GLTFLoader().loadAsync('assets/aircraft/'+(k==='fw190'?'fw190a8-own.glb':'me163b-own.glb')+'?v=209');model=g.scene;scene.add(model);AircraftArticulation.install(model,kind);model.traverse(o=>{if(o.isMesh){o.castShadow=!o.material.transparent;o.receiveShadow=!o.material.transparent;}});title.textContent=k==='fw190'?'Fw 190 A-8':'Me 163 B Komet';dimensions.textContent=k==='fw190'?'10.50 m span · 8.95 m length':'9.32 m span · 5.69 m length';gear.value=1;flaps.value=roll.value=pitch.value=0;view('hero');window.ready=true;}
for(const id of ['gear','flaps','roll','pitch'])document.getElementById(id).oninput=pose;aircraft.onchange=()=>load(aircraft.value);aircraft.value=new URLSearchParams(location.search).get('kind')==='me163'?'me163':'fw190';load(aircraft.value);
let last=performance.now();function loop(t){requestAnimationFrame(loop);if(model&&spin.checked){const dt=Math.min(.05,(t-last)/1000);if(kind==='me163')Me163Rig.generator(model,dt,120);else model.getObjectByName('prop').rotation.z-=dt*20;render();}last=t;}requestAnimationFrame(loop);
let drag=null;renderer.domElement.onpointerdown=e=>{mode='hero';cam=camera;drag={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId);};renderer.domElement.onpointermove=e=>{if(!drag)return;camera.position.applyAxisAngle(new THREE.Vector3(0,1,0),-(e.clientX-drag.x)*.008);camera.position.y=Math.max(-5,Math.min(16,camera.position.y+(e.clientY-drag.y)*.035));camera.lookAt(0,0,0);drag={x:e.clientX,y:e.clientY};render();};renderer.domElement.onpointerup=()=>drag=null;
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();ortho.left=-6*innerWidth/innerHeight;ortho.right=6*innerWidth/innerHeight;ortho.updateProjectionMatrix();render();});
</script></html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Terrain System — Step 1 Prototype</title>
<style>
  html,body{margin:0;height:100%;background:#87b3e0;overflow:hidden;font-family:monospace}
  canvas{display:block}
  #hud{position:absolute;top:8px;left:8px;color:#fff;background:rgba(0,0,0,.55);
       padding:8px 12px;font-size:13px;line-height:1.6;border-radius:4px;pointer-events:none}
  #hud b{color:#ffd76a}
</style>
</head>
<body>
<div id="hud">
  <b>Terrain System — Step 1 prototype</b><br>
  Standalone demo. Not wired into the flight sim — proves the tile/LOD technique in isolation.<br>
  WASD move · Q/E down/up · drag mouse to look · Shift = faster<br>
  tiles loaded: <span id="tileCount">-</span> &nbsp; focus tile: <span id="tileInfo">-</span><br>
  pos (m): <span id="posInfo">-</span> &nbsp; height under camera: <span id="hInfo">-</span> m
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="HeightProvider.js"></script>
<script src="TerrainTile.js"></script>
<script src="TerrainManager.js"></script>
<script>
'use strict';

const TILE_SIZE = 4000;   // metres — Step 1's "4x4 km" tile

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b3e0);
scene.fog = new THREE.Fog(0x87b3e0, 3000, 9000);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 1, 20000);
camera.position.set(TILE_SIZE/2, 900, TILE_SIZE/2 - 2500);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xcfe2f2, 0x4a5438, 1.0); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d0, 1.05); sun.position.set(-1800,2600,1400); scene.add(sun);

const heightProvider = new ProceduralHeightProvider(1);
const terrain = new TerrainManager(scene, TILE_SIZE, heightProvider);

// A modest grid around the origin (not the full 100x100 km world — that is
// Step 7) so the LOD distance bands are actually visible: near tiles render
// at LOD0, far ones visibly coarser. Manual ensureTile() calls here stand in
// for what WorldStreamer (Step 4) will do automatically from an aircraft
// position.
const GRID_RADIUS = 3;   // tiles out from the centre -> a 7x7 = 28x28 km demo patch
for(let tx = -GRID_RADIUS; tx <= GRID_RADIUS; tx++){
  for(let tz = -GRID_RADIUS; tz <= GRID_RADIUS; tz++){
    terrain.ensureTile(tx, tz);
  }
}

// ---- minimal free-fly controls, demo-only — the real flight sim's own
// controls/camera are never touched by this module ----
const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup',   e => keys[e.key.toLowerCase()] = false);
let yaw = 0, pitch = -0.15, dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('mousemove', e => {
  if(!dragging) return;
  yaw   -= (e.clientX - lastX) * 0.003;
  pitch -= (e.clientY - lastY) * 0.003;
  pitch = Math.max(-1.4, Math.min(1.4, pitch));
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const tileCountEl = document.getElementById('tileCount');
const tileInfoEl  = document.getElementById('tileInfo');
const posInfoEl   = document.getElementById('posInfo');
const hInfoEl     = document.getElementById('hInfo');

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.1, clock.getDelta());

  const dir = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const right = new THREE.Vector3(dir.z, 0, -dir.x);
  const speed = (keys['shift'] ? 900 : 220) * dt;
  if(keys['w']) camera.position.addScaledVector(dir, speed);
  if(keys['s']) camera.position.addScaledVector(dir, -speed);
  if(keys['a']) camera.position.addScaledVector(right, -speed);
  if(keys['d']) camera.position.addScaledVector(right, speed);
  if(keys['q']) camera.position.y -= speed;
  if(keys['e']) camera.position.y += speed;

  camera.rotation.set(0,0,0);
  camera.rotateY(yaw);
  camera.rotateX(pitch);

  // This is exactly the call a WorldStreamer/flight-sim integration will make
  // every frame with the AIRCRAFT's position instead of the free-fly camera's.
  terrain.updateLOD(camera.position.x, camera.position.z, dt);

  const { tx, tz } = terrain.worldToTileCoord(camera.position.x, camera.position.z);
  tileCountEl.textContent = terrain.tileCount;
  tileInfoEl.textContent = `(${tx}, ${tz})`;
  posInfoEl.textContent = `${camera.position.x.toFixed(0)}, ${camera.position.y.toFixed(0)}, ${camera.position.z.toFixed(0)}`;
  hInfoEl.textContent = terrain.getHeight(camera.position.x, camera.position.z).toFixed(0);

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>

name: Validate Corsair 3D model
# Build 233: the shipped F4U-1D (assets/aircraft/corsair-f4u1d-own.glb) is no longer generated by
# scripts/build-own-corsair.cjs. It is the supplied model (assets/aircraft/source/corsair-f4u1d-v3/) finished by
# scripts/finalize-corsair-v3.cjs. This workflow only checks it and never commits: the old version of this file
# rebuilt the previous generated model on every push to main and would have overwritten the supplied one.
on:
  pull_request:
    paths:
      - 'assets/aircraft/corsair-f4u1d-own.glb'
      - 'assets/aircraft/source/corsair-f4u1d-v3/**'
      - 'scripts/finalize-corsair-v3.cjs'
      - 'terrain-system/tests/corsair-native.cjs'
      - 'corsair-native.js'
      - '.github/workflows/build-corsair.yml'
  push:
    branches: [main]
    paths:
      - 'assets/aircraft/corsair-f4u1d-own.glb'
      - 'assets/aircraft/source/corsair-f4u1d-v3/**'
      - 'scripts/finalize-corsair-v3.cjs'
      - 'terrain-system/tests/corsair-native.cjs'
      - 'corsair-native.js'
      - '.github/workflows/build-corsair.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Shipped GLB is exactly what the finalizer makes from the unmodified source
        run: |
          node scripts/finalize-corsair-v3.cjs assets/aircraft/source/corsair-f4u1d-v3/Corsair_F4U1D_Review.glb "$RUNNER_TEMP/corsair.glb"
          cmp "$RUNNER_TEMP/corsair.glb" assets/aircraft/corsair-f4u1d-own.glb
      - name: Validate glTF, native rig contract, clips, tyre contacts and stores
        run: node terrain-system/tests/corsair-native.cjs

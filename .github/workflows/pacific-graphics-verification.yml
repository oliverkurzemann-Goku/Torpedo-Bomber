name: Pacific graphics verification
on: push
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        suite: [pacific-ultra-browser, pacific-shadows-browser, render-budget-browser]
    name: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node okinawa/tests/${{ matrix.suite }}.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.suite }}
          path: test-visuals/*.jpg
          if-no-files-found: ignore
